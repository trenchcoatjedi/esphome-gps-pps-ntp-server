globals:
  - id: active_constellation
    type: std::string
    restore_value: no
    initial_value: '"GLONASS"'


# ==============================================================================
# GNSS CONFIGURATION SCRIPTS
#
# The receiver's existing UBX-CFG-GNSS configuration is first polled.
# We preserve the complete configuration and change ONLY:
#
#   BeiDou  = GNSS ID 3
#   GLONASS = GNSS ID 6
#
# Bit 0 of the flags field is the enable bit.
# ==============================================================================


script:

  # ============================================================================
  # GPS + BeiDou
  # ============================================================================

  - id: switch_to_beidou
    mode: restart

    then:

      - lambda: |-

          ESP_LOGI(
            "gnss",
            "Requesting GPS + BeiDou configuration"
          );


          // --------------------------------------------------------------------
          // UBX-CFG-GNSS poll
          //
          // B5 62 06 3E 00 00 44 D2
          // --------------------------------------------------------------------

          const uint8_t poll[] = {
            0xB5, 0x62,
            0x06, 0x3E,
            0x00, 0x00,
            0x44, 0xD2
          };


          // --------------------------------------------------------------------
          // Clear stale UART data.
          // --------------------------------------------------------------------

          uint8_t discard;

          while (id(gps_uart)->available() > 0) {
            id(gps_uart)->read_byte(&discard);
          }


          // --------------------------------------------------------------------
          // Send CFG-GNSS poll.
          // --------------------------------------------------------------------

          id(gps_uart)->write_array(
            poll,
            sizeof(poll)
          );

          id(gps_uart)->flush();


          ESP_LOGI(
            "gnss",
            "CFG-GNSS poll sent"
          );


          // --------------------------------------------------------------------
          // Receive UBX packets until CFG-GNSS is found.
          //
          // Other packets are deliberately ignored. The M8083 may emit
          // unrelated UBX messages while we are waiting.
          // --------------------------------------------------------------------

          const uint32_t timeout_ms = 3000;
          const uint32_t start_ms = esphome::millis();

          uint8_t state = 0;

          uint8_t msg_class = 0;
          uint8_t msg_id = 0;

          uint16_t payload_length = 0;
          uint16_t payload_index = 0;

          uint8_t ck_a = 0;
          uint8_t ck_b = 0;

          uint8_t received_ck_a = 0;
          uint8_t received_ck_b = 0;

          std::vector<uint8_t> payload;

          bool found_cfg_gnss = false;


          while (
            (esphome::millis() - start_ms) < timeout_ms
          ) {

            if (id(gps_uart)->available() == 0) {
              delay(1);
              continue;
            }


            uint8_t c;

            if (!id(gps_uart)->read_byte(&c)) {
              continue;
            }


            switch (state) {

              // ---------------------------------------------------------------
              // Sync character 1
              // ---------------------------------------------------------------

              case 0:

                if (c == 0xB5) {
                  state = 1;
                }

                break;


              // ---------------------------------------------------------------
              // Sync character 2
              // ---------------------------------------------------------------

              case 1:

                if (c == 0x62) {

                  state = 2;

                } else if (c == 0xB5) {

                  state = 1;

                } else {

                  state = 0;
                }

                break;


              // ---------------------------------------------------------------
              // Class
              // ---------------------------------------------------------------

              case 2:

                msg_class = c;

                ck_a = c;
                ck_b = c;

                state = 3;

                break;


              // ---------------------------------------------------------------
              // ID
              // ---------------------------------------------------------------

              case 3:

                msg_id = c;

                ck_a += c;
                ck_b += ck_a;

                state = 4;

                break;


              // ---------------------------------------------------------------
              // Length LSB
              // ---------------------------------------------------------------

              case 4:

                payload_length = c;

                ck_a += c;
                ck_b += ck_a;

                state = 5;

                break;


              // ---------------------------------------------------------------
              // Length MSB
              // ---------------------------------------------------------------

              case 5:

                payload_length |=
                  (uint16_t(c) << 8);

                ck_a += c;
                ck_b += ck_a;

                payload.clear();

                if (payload_length > 0) {

                  payload.reserve(payload_length);
                  payload_index = 0;
                  state = 6;

                } else {

                  state = 7;
                }

                break;


              // ---------------------------------------------------------------
              // Payload
              // ---------------------------------------------------------------

              case 6:

                payload.push_back(c);

                ck_a += c;
                ck_b += ck_a;

                payload_index++;

                if (payload_index >= payload_length) {
                  state = 7;
                }

                break;


              // ---------------------------------------------------------------
              // Checksum A
              // ---------------------------------------------------------------

              case 7:

                received_ck_a = c;
                state = 8;

                break;


              // ---------------------------------------------------------------
              // Checksum B
              // ---------------------------------------------------------------

              case 8:

                received_ck_b = c;


                if (
                  received_ck_a == ck_a &&
                  received_ck_b == ck_b
                ) {

                  if (
                    msg_class == 0x06 &&
                    msg_id == 0x3E
                  ) {

                    found_cfg_gnss = true;

                  } else {

                    ESP_LOGD(
                      "gnss",
                      "Ignoring UBX class=0x%02X id=0x%02X len=%u",
                      msg_class,
                      msg_id,
                      payload_length
                    );
                  }

                } else {

                  ESP_LOGW(
                    "gnss",
                    "Ignoring UBX packet with bad checksum"
                  );
                }


                state = 0;

                break;


              default:

                state = 0;
                break;
            }


            if (found_cfg_gnss) {
              break;
            }
          }


          // --------------------------------------------------------------------
          // Make sure CFG-GNSS was received.
          // --------------------------------------------------------------------

          if (!found_cfg_gnss) {

            ESP_LOGE(
              "gnss",
              "Timed out waiting for UBX-CFG-GNSS response"
            );

            return;
          }


          // --------------------------------------------------------------------
          // Validate payload.
          // --------------------------------------------------------------------

          if (payload_length < 4) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS payload too short: %u",
              payload_length
            );

            return;
          }


          const uint8_t msg_ver =
            payload[0];

          const uint8_t num_trk_ch_hw =
            payload[1];

          const uint8_t num_trk_ch_use =
            payload[2];

          const uint8_t num_blocks =
            payload[3];


          ESP_LOGI(
            "gnss",
            "CFG-GNSS: version=%u hw_channels=%u use_channels=%u blocks=%u",
            msg_ver,
            num_trk_ch_hw,
            num_trk_ch_use,
            num_blocks
          );


          // --------------------------------------------------------------------
          // Each configuration block is 8 bytes.
          // --------------------------------------------------------------------

          const uint16_t required_length =
            4 + (uint16_t(num_blocks) * 8);


          if (payload_length < required_length) {

            ESP_LOGE(
              "gnss",
              "Malformed CFG-GNSS payload: received=%u required=%u",
              payload_length,
              required_length
            );

            return;
          }


          // --------------------------------------------------------------------
          // Work on a complete copy of the receiver's configuration.
          // --------------------------------------------------------------------

          std::vector<uint8_t> new_payload =
            payload;


          bool found_beidou = false;
          bool found_glonass = false;


          // --------------------------------------------------------------------
          // Modify only GNSS IDs 3 and 6.
          // --------------------------------------------------------------------

          for (
            uint8_t i = 0;
            i < num_blocks;
            i++
          ) {

            const uint16_t offset =
              4 + (uint16_t(i) * 8);


            const uint8_t gnss_id =
              new_payload[offset];


            const uint8_t res_trk_ch =
              new_payload[offset + 1];


            const uint8_t max_trk_ch =
              new_payload[offset + 2];


            uint32_t flags =
              uint32_t(new_payload[offset + 4]) |
              (uint32_t(new_payload[offset + 5]) << 8) |
              (uint32_t(new_payload[offset + 6]) << 16) |
              (uint32_t(new_payload[offset + 7]) << 24);


            const bool old_enabled =
              (flags & 0x00000001UL) != 0;


            const char *name = "UNKNOWN";


            switch (gnss_id) {

              case 0:
                name = "GPS";
                break;

              case 1:
                name = "SBAS";
                break;

              case 2:
                name = "Galileo";
                break;

              case 3:
                name = "BeiDou";
                break;

              case 4:
                name = "IMES";
                break;

              case 5:
                name = "QZSS";
                break;

              case 6:
                name = "GLONASS";
                break;
            }


            // ---------------------------------------------------------------
            // BeiDou ON
            // ---------------------------------------------------------------

            if (gnss_id == 3) {

              found_beidou = true;

              flags |= 0x00000001UL;
            }


            // ---------------------------------------------------------------
            // GLONASS OFF
            // ---------------------------------------------------------------

            if (gnss_id == 6) {

              found_glonass = true;

              flags &= ~0x00000001UL;
            }


            // ---------------------------------------------------------------
            // Write flags back.
            // ---------------------------------------------------------------

            new_payload[offset + 4] =
              uint8_t(flags & 0xFF);

            new_payload[offset + 5] =
              uint8_t((flags >> 8) & 0xFF);

            new_payload[offset + 6] =
              uint8_t((flags >> 16) & 0xFF);

            new_payload[offset + 7] =
              uint8_t((flags >> 24) & 0xFF);


            ESP_LOGI(
              "gnss",
              "  %s: res=%u max=%u %s -> %s flags=0x%08X",
              name,
              res_trk_ch,
              max_trk_ch,
              old_enabled ? "ON" : "OFF",
              (flags & 0x00000001UL) ? "ON" : "OFF",
              (unsigned)flags
            );
          }


          // --------------------------------------------------------------------
          // Both required blocks must exist.
          // --------------------------------------------------------------------

          if (!found_beidou) {

            ESP_LOGE(
              "gnss",
              "Receiver did not report a BeiDou configuration block"
            );

            return;
          }


          if (!found_glonass) {

            ESP_LOGE(
              "gnss",
              "Receiver did not report a GLONASS configuration block"
            );

            return;
          }


          // --------------------------------------------------------------------
          // Build complete CFG-GNSS frame.
          // --------------------------------------------------------------------

          std::vector<uint8_t> frame;

          frame.reserve(
            8 + new_payload.size()
          );


          frame.push_back(0xB5);
          frame.push_back(0x62);

          frame.push_back(0x06);
          frame.push_back(0x3E);

          frame.push_back(
            uint8_t(new_payload.size() & 0xFF)
          );

          frame.push_back(
            uint8_t((new_payload.size() >> 8) & 0xFF)
          );


          frame.insert(
            frame.end(),
            new_payload.begin(),
            new_payload.end()
          );


          // --------------------------------------------------------------------
          // UBX Fletcher checksum.
          // --------------------------------------------------------------------

          uint8_t frame_ck_a = 0;
          uint8_t frame_ck_b = 0;


          for (size_t i = 2; i < frame.size(); i++) {

            frame_ck_a += frame[i];
            frame_ck_b += frame_ck_a;
          }


          frame.push_back(frame_ck_a);
          frame.push_back(frame_ck_b);


          ESP_LOGI(
            "gnss",
            "Sending complete CFG-GNSS GPS + BeiDou (%u bytes)",
            (unsigned)frame.size()
          );


          // --------------------------------------------------------------------
          // Send.
          // --------------------------------------------------------------------

          id(gps_uart)->write_array(
            frame.data(),
            frame.size()
          );

          id(gps_uart)->flush();


          // --------------------------------------------------------------------
          // Wait for ACK-ACK / ACK-NAK.
          // --------------------------------------------------------------------

          const uint32_t ack_start =
            esphome::millis();


          bool got_ack = false;
          bool ack_ok = false;


          uint8_t ack_state = 0;

          uint8_t ack_class = 0;
          uint8_t ack_id = 0;

          uint8_t ack_payload[2] = {
            0,
            0
          };

          uint8_t ack_ck_a = 0;
          uint8_t ack_ck_b = 0;

          uint8_t ack_rx_ck_a = 0;
          uint8_t ack_rx_ck_b = 0;

          uint8_t ack_payload_index = 0;


          while (
            (esphome::millis() - ack_start) < 1500
          ) {

            if (id(gps_uart)->available() == 0) {
              delay(1);
              continue;
            }


            uint8_t c;

            if (!id(gps_uart)->read_byte(&c)) {
              continue;
            }


            switch (ack_state) {

              case 0:

                if (c == 0xB5) {
                  ack_state = 1;
                }

                break;


              case 1:

                if (c == 0x62) {

                  ack_state = 2;

                } else if (c == 0xB5) {

                  ack_state = 1;

                } else {

                  ack_state = 0;
                }

                break;


              case 2:

                ack_class = c;

                ack_ck_a = c;
                ack_ck_b = c;

                ack_state = 3;

                break;


              case 3:

                ack_id = c;

                ack_ck_a += c;
                ack_ck_b += ack_ck_a;

                ack_state = 4;

                break;


              case 4:

                if (c != 0x02) {

                  ack_state = 0;
                  break;
                }

                ack_ck_a += c;
                ack_ck_b += ack_ck_a;

                ack_state = 5;

                break;


              case 5:

                if (c != 0x00) {

                  ack_state = 0;
                  break;
                }

                ack_ck_a += c;
                ack_ck_b += ack_ck_a;

                ack_payload_index = 0;
                ack_state = 6;

                break;


              case 6:

                ack_payload[ack_payload_index++] = c;

                ack_ck_a += c;
                ack_ck_b += ack_ck_a;

                if (ack_payload_index >= 2) {
                  ack_state = 7;
                }

                break;


              case 7:

                ack_rx_ck_a = c;
                ack_state = 8;

                break;


              case 8:

                ack_rx_ck_b = c;


                if (
                  ack_rx_ck_a == ack_ck_a &&
                  ack_rx_ck_b == ack_ck_b &&
                  ack_class == 0x05 &&
                  (ack_id == 0x00 || ack_id == 0x01) &&
                  ack_payload[0] == 0x06 &&
                  ack_payload[1] == 0x3E
                ) {

                  got_ack = true;
                  ack_ok = (ack_id == 0x01);
                }


                ack_state = 0;

                break;
            }


            if (got_ack) {
              break;
            }
          }


          // --------------------------------------------------------------------
          // Report result.
          // --------------------------------------------------------------------

          if (!got_ack) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS GPS + BeiDou: no ACK received"
            );

            return;
          }


          if (!ack_ok) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS GPS + BeiDou: receiver returned NAK"
            );

            return;
          }


          ESP_LOGI(
            "gnss",
            "CFG-GNSS GPS + BeiDou: ACK-ACK received"
          );


          id(active_constellation) =
            "BeiDou";

          id(gnss_secondary_constellation)->publish_state("BeiDou");


  # ============================================================================
  # GPS + GLONASS
  # ============================================================================

  - id: switch_to_glonass
    mode: restart

    then:

      - lambda: |-

          ESP_LOGI(
            "gnss",
            "Requesting GPS + GLONASS configuration"
          );


          // --------------------------------------------------------------------
          // UBX-CFG-GNSS poll
          // --------------------------------------------------------------------

          const uint8_t poll[] = {
            0xB5, 0x62,
            0x06, 0x3E,
            0x00, 0x00,
            0x44, 0xD2
          };


