globals:
  - id: active_constellation
    type: std::string
    restore_value: no
    initial_value: '"GLONASS"'

script:
  # --------------------------------------------------------------------------
  # Switch to BeiDou (Atomic Block Transmission)
  # --------------------------------------------------------------------------
  - id: switch_to_beidou
    mode: restart
    then:
      - logger.log: "Writing UBX-CFG-GNSS for BeiDou..."
      - lambda: |-
          // Complete 46-byte frame (including pre-calculated Fletcher checksums)
          uint8_t frame[] = {
            0xB5, 0x62,             // Sync
            0x06, 0x3E,             // Class/ID (CFG-GNSS)
            0x2C, 0x00,             // Length (44 bytes)
            0x00, 0x20, 0x20, 0x05, // Header
            0x00, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01, // GPS
            0x01, 0x01, 0x03, 0x00, 0x01, 0x00, 0x01, 0x01, // SBAS
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01, // BeiDou (ON)
            0x05, 0x00, 0x03, 0x00, 0x01, 0x00, 0x01, 0x01, // QZSS
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x00, // GLONASS (OFF)
            0x1C, 0x61              // Pre-calculated Checksum (ck_a, ck_b)
          };
          
          // Write the entire block atomically to prevent interleaving
          id(gps_uart)->write_array(frame, sizeof(frame));
          id(gps_uart)->flush();

      - delay: 150ms

      - logger.log: "Injecting Controlled GNSS Correlator Reset..."
      - lambda: |-
          // Atomic Controlled Reset Frame matching ubxtool execution
          uint8_t rst_frame[] = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };
          id(gps_uart)->write_array(rst_frame, sizeof(rst_frame));
          id(gps_uart)->flush();
          
          id(gnss_secondary_constellation).publish_state("BeiDou");
      - logger.log: "M8030 baseband re-mapping to BeiDou completed."

  # --------------------------------------------------------------------------
  # Switch to GLONASS (Atomic Block Transmission)
  # --------------------------------------------------------------------------
  - id: switch_to_glonass
    mode: restart
    then:
      - logger.log: "Writing UBX-CFG-GNSS for GLONASS..."
      - lambda: |-
          uint8_t frame[] = {
            0xB5, 0x62,             // Sync
            0x06, 0x3E,             // Class/ID (CFG-GNSS)
            0x2C, 0x00,             // Length (44 bytes)
            0x00, 0x20, 0x20, 0x05, // Header
            0x00, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01, // GPS
            0x01, 0x01, 0x03, 0x00, 0x01, 0x00, 0x01, 0x01, // SBAS
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x00, // BeiDou (OFF)
            0x05, 0x00, 0x03, 0x00, 0x01, 0x00, 0x01, 0x01, // QZSS
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x01, // GLONASS (ON)
            0x1C, 0x6F              // Pre-calculated Checksum (ck_a, ck_b)
          };
          
          id(gps_uart)->write_array(frame, sizeof(frame));
          id(gps_uart)->flush();

      - delay: 150ms

      - logger.log: "Injecting Controlled GNSS Correlator Reset..."
      - lambda: |-
          uint8_t rst_frame[] = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };
          id(gps_uart)->write_array(rst_frame, sizeof(rst_frame));
          id(gps_uart)->flush();
          
          id(gnss_secondary_constellation).publish_state("GLONASS");
      - logger.log: "M8030 baseband re-mapping to GLONASS completed."


select:
  - platform: template
    name: "GNSS Secondary Constellation Selector"
    id: gnss_secondary_constellation
    restore_value: false
    optimistic: true           # Keeps UI lock static on whatever string option the user clicked
    initial_option: "GLONASS"  # Removes unstable loop lambda hooks
    options:
      - "GLONASS"
      - "BeiDou"
    set_action:
      - if:
          condition:
            lambda: |-
              return (x != id(active_constellation));
          then:
            - lambda: |-
                ESP_LOGI("gnss", "Switching constellation to: %s", x.c_str());
                id(active_constellation) = x;
            - if:
                condition:
                  lambda: |-
                    return x == "BeiDou";
                then:
                  - script.execute: switch_to_beidou
                else:
                  - script.execute: switch_to_glonass
