globals:
  - id: active_constellation
    type: std::string
    restore_value: no
    initial_value: '"GLONASS"'

script:
  # --------------------------------------------------------------------------
  # Switch to BeiDou (ESP-IDF Compliant Sequential Clear)
  # --------------------------------------------------------------------------
  - id: switch_to_beidou
    mode: restart
    then:
      - logger.log: "Acquiring hardware serial lock for BeiDou layout..."
      - lambda: |-
          // 1. Declare frames dynamically to compute mathematically perfect checksums
          std::vector<uint8_t> disable_glonass = {
            0xB5, 0x62, 0x06, 0x3E, 0x0C, 0x00, 
            0x00, 0x20, 0x20, 0x01, 
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x00
          };
          std::vector<uint8_t> enable_beidou = {
            0xB5, 0x62, 0x06, 0x3E, 0x0C, 0x00, 
            0x00, 0x20, 0x20, 0x01, 
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01
          };
          std::vector<uint8_t> rst_frame = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };

          // Lambda helper to attach correct u-blox Fletcher-8 checksums
          auto apply_ubx_checksum = [](std::vector<uint8_t> &f) {
            uint8_t ck_a = 0, ck_b = 0;
            for (size_t i = 2; i < f.size(); i++) { ck_a += f[i]; ck_b += ck_a; }
            f.push_back(ck_a); f.push_back(ck_b);
          };
          apply_ubx_checksum(disable_glonass);
          apply_ubx_checksum(enable_beidou);

          // 2. FIX: Drain the ESP-IDF hardware buffers using the proper component method
          uint8_t dummy_byte;
          while(id(gps_uart)->available() > 0) { 
            id(gps_uart)->read_byte(&dummy_byte); 
          } 
          
          // 3. Sequential Write Transactions with Hard Block Halts
          id(gps_uart)->write_array(disable_glonass.data(), disable_glonass.size());
          id(gps_uart)->flush();
          delay(200); 
          
          id(gps_uart)->write_array(enable_beidou.data(), enable_beidou.size());
          id(gps_uart)->flush();
          delay(100);

          id(gps_uart)->write_array(rst_frame.data(), rst_frame.size());
          id(gps_uart)->flush();

      - lambda: |-
          id(gnss_secondary_constellation).publish_state("BeiDou");
      - logger.log: "M8030 baseband switched to BeiDou."

  # --------------------------------------------------------------------------
  # Switch to GLONASS (ESP-IDF Compliant Sequential Clear)
  # --------------------------------------------------------------------------
  - id: switch_to_glonass
    mode: restart
    then:
      - logger.log: "Acquiring hardware serial lock for GLONASS layout..."
      - lambda: |-
          std::vector<uint8_t> disable_beidou = {
            0xB5, 0x62, 0x06, 0x3E, 0x0C, 0x00, 
            0x00, 0x20, 0x20, 0x01, 
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x00
          };
          std::vector<uint8_t> enable_glonass = {
            0xB5, 0x62, 0x06, 0x3E, 0x0C, 0x00, 
            0x00, 0x20, 0x20, 0x01, 
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x01
          };
          std::vector<uint8_t> rst_frame = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };

          auto apply_ubx_checksum = [](std::vector<uint8_t> &f) {
            uint8_t ck_a = 0, ck_b = 0;
            for (size_t i = 2; i < f.size(); i++) { ck_a += f[i]; ck_b += ck_a; }
            f.push_back(ck_a); f.push_back(ck_b);
          };
          apply_ubx_checksum(disable_beidou);
          apply_ubx_checksum(enable_glonass);

          // Drain the ESP-IDF hardware buffers using the proper component method
          uint8_t dummy_byte;
          while(id(gps_uart)->available() > 0) { 
            id(gps_uart)->read_byte(&dummy_byte); 
          } 

          id(gps_uart)->write_array(disable_beidou.data(), disable_beidou.size());
          id(gps_uart)->flush();
          delay(200); 

          id(gps_uart)->write_array(enable_glonass.data(), enable_glonass.size());
          id(gps_uart)->flush();
          delay(100);

          id(gps_uart)->write_array(rst_frame.data(), rst_frame.size());
          id(gps_uart)->flush();

      - lambda: |-
          id(gnss_secondary_constellation).publish_state("GLONASS");
      - logger.log: "M8030 hard overwrite to GLONASS completed."

select:
  - platform: template
    name: "GNSS Secondary Constellation Selector"
    id: gnss_secondary_constellation
    restore_value: false
    optimistic: true
    initial_option: "GLONASS"
    options:
      - "GLONASS"
      - "BeiDou"
    set_action:
      - if:
          condition:
            lambda: |-
              return (x != id(active_constellation));
          then:
            - lambda: |-
                ESP_LOGI("gnss", "Switching constellation to: %s", x.c_str());
                id(active_constellation) = x;
            - if:
                condition:
                  lambda: |-
                    return x == "BeiDou";
                then:
                  - script.execute: switch_to_beidou
                else:
                  - script.execute: switch_to_glonass
