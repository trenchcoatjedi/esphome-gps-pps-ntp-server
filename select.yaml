globals:
  - id: active_constellation
    type: std::string
    restore_value: no
    initial_value: '"GLONASS"'

script:
  # --------------------------------------------------------------------------
  # Switch to BeiDou (Step 1: Disable GLONASS -> Step 2: Enable BeiDou)
  # --------------------------------------------------------------------------
  - id: switch_to_beidou
    mode: restart
    then:
      - logger.log: "Step 1: Disabling GLONASS tracks..."
      - lambda: |-
          // UBX-CFG-GNSS: 1 block, Version 0, Disable GLONASS (0x06)
          std::vector<uint8_t> frame = {
            0xB5, 0x62,             // Sync
            0x06, 0x3E,             // Class/ID (CFG-GNSS)
            0x0C, 0x00,             // Length (12 bytes)
            0x00, 0x20, 0x20, 0x01, // Header (1 block)
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x00  // GLONASS Block (Disabled)
          };

          // Dynamically compute the exact checksum bytes
          uint8_t ck_a = 0, ck_b = 0;
          for (size_t i = 2; i < frame.size(); i++) {
            ck_a += frame[i];
            ck_b += ck_a;
          }
          frame.push_back(ck_a);
          frame.push_back(ck_b);

          // Atomic transmission bypass
          id(gps_uart)->write_array(frame.data(), frame.size());
          id(gps_uart)->flush();

      - delay: 300ms

      - logger.log: "Step 2: Activating BeiDou tracks..."
      - lambda: |-
          // UBX-CFG-GNSS: 1 block, Version 0, Enable BeiDou (0x03)
          std::vector<uint8_t> frame = {
            0xB5, 0x62,             // Sync
            0x06, 0x3E,             // Class/ID (CFG-GNSS)
            0x0C, 0x00,             // Length (12 bytes)
            0x00, 0x20, 0x20, 0x01, // Header (1 block)
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01  // BeiDou Block (Enabled)
          };

          uint8_t ck_a = 0, ck_b = 0;
          for (size_t i = 2; i < frame.size(); i++) {
            ck_a += frame[i];
            ck_b += ck_a;
          }
          frame.push_back(ck_a);
          frame.push_back(ck_b);

          id(gps_uart)->write_array(frame.data(), frame.size());
          id(gps_uart)->flush();

      - delay: 150ms

      - logger.log: "Step 3: Injecting Hot Reset..."
      - lambda: |-
          uint8_t rst_frame[] = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };
          id(gps_uart)->write_array(rst_frame, sizeof(rst_frame));
          id(gps_uart)->flush();
          
          id(gnss_secondary_constellation).publish_state("BeiDou");
      - logger.log: "M8030 baseband switched to BeiDou."

  # --------------------------------------------------------------------------
  # Switch to GLONASS (Step 1: Disable BeiDou -> Step 2: Enable GLONASS)
  # --------------------------------------------------------------------------
  - id: switch_to_glonass
    mode: restart
    then:
      - logger.log: "Step 1: Disabling BeiDou tracks..."
      - lambda: |-
          // UBX-CFG-GNSS: 1 block, Version 0, Disable BeiDou (0x03)
          std::vector<uint8_t> frame = {
            0xB5, 0x62,             // Sync
            0x06, 0x3E,             // Class/ID (CFG-GNSS)
            0x0C, 0x00,             // Length (12 bytes)
            0x00, 0x20, 0x20, 0x01, // Header (1 block)
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x00  // BeiDou Block (Disabled)
          };

          uint8_t ck_a = 0, ck_b = 0;
          for (size_t i = 2; i < frame.size(); i++) {
            ck_a += frame[i];
            ck_b += ck_a;
          }
          frame.push_back(ck_a);
          frame.push_back(ck_b);

          id(gps_uart)->write_array(frame.data(), frame.size());
          id(gps_uart)->flush();

      - delay: 300ms

      - logger.log: "Step 2: Activating GLONASS tracks..."
      - lambda: |-
          // UBX-CFG-GNSS: 1 block, Version 0, Enable GLONASS (0x06)
          std::vector<uint8_t> frame = {
            0xB5, 0x62,             // Sync
            0x06, 0x3E,             // Class/ID (CFG-GNSS)
            0x0C, 0x00,             // Length (12 bytes)
            0x00, 0x20, 0x20, 0x01, // Header (1 block)
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x01  // GLONASS Block (Enabled)
          };

          uint8_t ck_a = 0, ck_b = 0;
          for (size_t i = 2; i < frame.size(); i++) {
            ck_a += frame[i];
            ck_b += ck_a;
          }
          frame.push_back(ck_a);
          frame.push_back(ck_b);

          id(gps_uart)->write_array(frame.data(), frame.size());
          id(gps_uart)->flush();

      - delay: 150ms

      - logger.log: "Step 3: Injecting Hot Reset..."
      - lambda: |-
          uint8_t rst_frame[] = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };
          id(gps_uart)->write_array(rst_frame, sizeof(rst_frame));
          id(gps_uart)->flush();
          
          id(gnss_secondary_constellation).publish_state("GLONASS");
      - logger.log: "M8030 baseband switched to GLONASS."


select:
  - platform: template
    name: "GNSS Secondary Constellation Selector"
    id: gnss_secondary_constellation
    restore_value: false
    optimistic: true           # Keeps UI lock static on whatever string option the user clicked
    initial_option: "GLONASS"  # Removes unstable loop lambda hooks
    options:
      - "GLONASS"
      - "BeiDou"
    set_action:
      - if:
          condition:
            lambda: |-
              return (x != id(active_constellation));
          then:
            - lambda: |-
                ESP_LOGI("gnss", "Switching constellation to: %s", x.c_str());
                id(active_constellation) = x;
            - if:
                condition:
                  lambda: |-
                    return x == "BeiDou";
                then:
                  - script.execute: switch_to_beidou
                else:
                  - script.execute: switch_to_glonass
