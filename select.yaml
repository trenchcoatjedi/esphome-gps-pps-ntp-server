select:
  - platform: template
    name: "GNSS Secondary Constellation"
    id: gnss_secondary_constellation
    optimistic: true
    restore_value: false
    initial_option: "GLONASS"
    options:
      - "GLONASS"
      - "BeiDou"

    set_action:
      - if:
          condition:
            lambda: |-
              return x == "BeiDou";
          then:
            - logger.log: "Switching from GLONASS to BeiDou"
            - uart.write:
                id: gps_uart
                data: [0x01]

            - delay: 500ms

            - uart.write:
                id: gps_uart
                data: [0x02]

          else:
            - logger.log: "Switching from BeiDou to GLONASS"
            - uart.write:
                id: gps_uart
                data: [0x03]

            - delay: 500ms

            - uart.write:
                id: gps_uart
                data: [0x04]
