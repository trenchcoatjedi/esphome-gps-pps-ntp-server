                payload.clear();

                if (payload_length > 0) {

                  payload.reserve(payload_length);
                  payload_index = 0;
                  state = 6;

                } else {

                  state = 7;
                }

                break;


              case 6:

                payload.push_back(c);

                ck_a += c;
                ck_b += ck_a;

                payload_index++;

                if (payload_index >= payload_length) {
                  state = 7;
                }

                break;


              case 7:

                received_ck_a = c;
                state = 8;

                break;


              case 8:

                received_ck_b = c;


                if (
                  received_ck_a == ck_a &&
                  received_ck_b == ck_b
                ) {

                  if (
