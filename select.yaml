          for (size_t i = 2; i < frame.size(); i++) {

            frame_ck_a += frame[i];
            frame_ck_b += frame_ck_a;
          }


          frame.push_back(frame_ck_a);
          frame.push_back(frame_ck_b);


          ESP_LOGI(
            "gnss",
            "Sending complete CFG-GNSS GPS + GLONASS (%u bytes)",
            (unsigned)frame.size()
          );


          id(gps_uart)->write_array(
            frame.data(),
            frame.size()
          );

          id(gps_uart)->flush();


          // --------------------------------------------------------------------
          // Wait for ACK-ACK / ACK-NAK.
          // --------------------------------------------------------------------

          const uint32_t ack_start =
            esphome::millis();


          bool got_ack = false;
          bool ack_ok = false;


          uint8_t ack_state = 0;

          uint8_t ack_class = 0;
          uint8_t ack_id = 0;

          uint8_t ack_payload[2] = {
            0,
            0
          };

          uint8_t ack_ck_a = 0;
          uint8_t ack_ck_b = 0;

          uint8_t ack_rx_ck_a = 0;
          uint8_t ack_rx_ck_b = 0;

          uint8_t ack_payload_index = 0;


          while (
            (esphome::millis() - ack_start) < 1500
          ) {

            if (id(gps_uart)->available() == 0) {
              delay(1);
              continue;
            }


            uint8_t c;

            if (!id(gps_uart)->read_byte(&c)) {
              continue;
            }


            switch (ack_state) {

              case 0:

                if (c == 0xB5) {
                  ack_state = 1;
                }

                break;


              case 1:

                if (c == 0x62) {

                  ack_state = 2;

                } else if (c == 0xB5) {

                  ack_state = 1;

                } else {

                  ack_state = 0;
                }

                break;


              case 2:

                ack_class = c;

                ack_ck_a = c;
                ack_ck_b = c;

                ack_state = 3;

                break;


              case 3:

                ack_id = c;

                ack_ck_a += c;
                ack_ck_b += ack_ck_a;

                ack_state = 4;

                break;


              case 4:

                if (c != 0x02) {

                  ack_state = 0;
                  break;
                }

                ack_ck_a += c;
                ack_ck_b += ack_ck_a;

                ack_state = 5;

                break;


              case 5:

                if (c != 0x00) {

                  ack_state = 0;
                  break;
                }

                ack_ck_a += c;
                ack_ck_b += ack_ck_a;

                ack_payload_index = 0;
                ack_state = 6;

                break;


              case 6:

                ack_payload[ack_payload_index++] = c;

                ack_ck_a += c;
                ack_ck_b += ack_ck_a;

                if (ack_payload_index >= 2) {
                  ack_state = 7;
                }

                break;


              case 7:

                ack_rx_ck_a = c;
                ack_state = 8;

                break;


              case 8:

                ack_rx_ck_b = c;


                if (
                  ack_rx_ck_a == ack_ck_a &&
                  ack_rx_ck_b == ack_ck_b &&
                  ack_class == 0x05 &&
                  (ack_id == 0x00 || ack_id == 0x01) &&
                  ack_payload[0] == 0x06 &&
                  ack_payload[1] == 0x3E
                ) {

                  got_ack = true;
                  ack_ok = (ack_id == 0x01);
                }


                ack_state = 0;

                break;
            }


            if (got_ack) {
              break;
            }
          }


          if (!got_ack) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS GPS + GLONASS: no ACK received"
            );

            return;
          }


          if (!ack_ok) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS GPS + GLONASS: receiver returned NAK"
            );

            return;
          }


          ESP_LOGI(
            "gnss",
            "CFG-GNSS GPS + GLONASS: ACK-ACK received"
          );


          id(active_constellation) =
            "GLONASS";

          id(gnss_secondary_constellation)->publish_state("GLONASS");
# ==============================================================================
# SELECTOR
# ==============================================================================

select:

  - platform: template

    name: "GNSS Secondary Constellation Selector"

    id: gnss_secondary_constellation

    restore_value: false

    optimistic: false

    initial_option: "GLONASS"

    options:
      - "GLONASS"
      - "BeiDou"

    set_action:

      - lambda: |-

          ESP_LOGI(
            "gnss",
            "Requested constellation change: %s",
            x.c_str()
          );


      - if:

          condition:

            lambda: |-
              return x == "BeiDou";

          then:

            - script.execute: switch_to_beidou

          else:

            - script.execute: switch_to_glonass
