globals:
  - id: active_constellation
    type: std::string
    restore_value: no
    initial_value: '"GLONASS"'

script:
  # --------------------------------------------------------------------------
  # Switch to BeiDou (Core Thread Suspension Bypass)
  # --------------------------------------------------------------------------
  - id: switch_to_beidou
    mode: restart
    then:
      - logger.log: "Acquiring hardware serial lock for BeiDou layout..."
      - lambda: |-
          // 1. Re-declare explicit single block configurations
          uint8_t disable_glonass[] = {
            0xB5, 0x62, 0x06, 0x3E, 0x0C, 0x00, 
            0x00, 0x20, 0x20, 0x01, 
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x00,
            0x8A, 0xEE
          };
          uint8_t enable_beidou[] = {
            0xB5, 0x62, 0x06, 0x3E, 0x0C, 0x00, 
            0x00, 0x20, 0x20, 0x01, 
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01,
            0x89, 0xF1
          };
          uint8_t rst_frame[] = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };

          // 2. CRITICAL: Clear background memory buffers and force transmission
          while(id(gps_uart)->available()) { id(gps_uart)->read(); } 
          
          id(gps_uart)->write_array(disable_glonass, sizeof(disable_glonass));
          id(gps_uart)->flush();
          delay(200); // Strict hard hardware delay (in milliseconds)
          
          id(gps_uart)->write_array(enable_beidou, sizeof(enable_beidou));
          id(gps_uart)->flush();
          delay(100);

          id(gps_uart)->write_array(rst_frame, sizeof(rst_frame));
          id(gps_uart)->flush();

      - lambda: |-
          id(gnss_secondary_constellation).publish_state("BeiDou");
      - logger.log: "M8030 hard overwrite to BeiDou completed."

  # --------------------------------------------------------------------------
  # Switch to GLONASS (Core Thread Suspension Bypass)
  # --------------------------------------------------------------------------
  - id: switch_to_glonass
    mode: restart
    then:
      - logger.log: "Acquiring hardware serial lock for GLONASS layout..."
      - lambda: |-
          uint8_t disable_beidou[] = {
            0xB5, 0x62, 0x06, 0x3E, 0x0C, 0x00, 
            0x00, 0x20, 0x20, 0x01, 
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x00,
            0x88, 0xF0
          };
          uint8_t enable_glonass[] = {
            0xB5, 0x62, 0x06, 0x3E, 0x0C, 0x00, 
            0x00, 0x20, 0x20, 0x01, 
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x01,
            0x8B, 0xEF
          };
          uint8_t rst_frame[] = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };

          // Clear background memory buffers and force transmission
          while(id(gps_uart)->available()) { id(gps_uart)->read(); } 

          id(gps_uart)->write_array(disable_beidou, sizeof(disable_beidou));
          id(gps_uart)->flush();
          delay(200); 

          id(gps_uart)->write_array(enable_glonass, sizeof(enable_glonass));
          id(gps_uart)->flush();
          delay(100);

          id(gps_uart)->write_array(rst_frame, sizeof(rst_frame));
          id(gps_uart)->flush();

      - lambda: |-
          id(gnss_secondary_constellation).publish_state("GLONASS");
      - logger.log: "M8030 hard overwrite to GLONASS completed."

select:
  - platform: template
    name: "GNSS Secondary Constellation Selector"
    id: gnss_secondary_constellation
    restore_value: false
    optimistic: true
    initial_option: "GLONASS"
    options:
      - "GLONASS"
      - "BeiDou"
    set_action:
      - if:
          condition:
            lambda: |-
              return (x != id(active_constellation));
          then:
            - lambda: |-
                ESP_LOGI("gnss", "Switching constellation to: %s", x.c_str());
                id(active_constellation) = x;
            - if:
                condition:
                  lambda: |-
                    return x == "BeiDou";
                then:
                  - script.execute: switch_to_beidou
                else:
                  - script.execute: switch_to_glonass
