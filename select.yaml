globals:
  - id: active_constellation
    type: std::string
    restore_value: no
    initial_value: '"GLONASS"'


script:

  # ==========================================================================
  # Switch to GPS + BeiDou
  # ==========================================================================

  - id: switch_to_beidou
    mode: single
    then:

      - logger.log:
          level: INFO
          format: "GNSS: requesting GPS + BeiDou configuration"

      - lambda: |-

          // ------------------------------------------------------------------
          // Build UBX-CFG-GNSS
          //
          // GPS + BeiDou
          //
          // msgVer          = 0
          // numTrkChHw      = 32
          // numTrkChUse     = 32
          // numConfigBlocks = 2
          // ------------------------------------------------------------------

          std::vector<uint8_t> msg = {

            // UBX sync
            0xB5, 0x62,

            // Class = CFG
            // ID    = GNSS
            0x06, 0x3E,

            // Payload length = 20
            0x14, 0x00,

            // --------------------------------------------------------------
            // CFG-GNSS header
            // --------------------------------------------------------------

            // msgVer
            0x00,

            // numTrkChHw
            0x20,

            // numTrkChUse
            0x20,

            // numConfigBlocks
            0x02,


            // --------------------------------------------------------------
            // GPS
            // --------------------------------------------------------------

            // gnssId = GPS
            0x00,

            // resTrkCh = 8
            0x08,

            // maxTrkCh = 16
            0x10,

            // reserved
            0x00,

            // flags = 0x01010001
            0x01, 0x00, 0x01, 0x01,


            // --------------------------------------------------------------
            // BeiDou
            // --------------------------------------------------------------

            // gnssId = BeiDou
            0x03,

            // resTrkCh = 8
            0x08,

            // maxTrkCh = 16
            0x10,

            // reserved
            0x00,

            // flags = 0x01010001
            0x01, 0x00, 0x01, 0x01
          };


          // ------------------------------------------------------------------
          // Calculate UBX Fletcher checksum
          // ------------------------------------------------------------------

          uint8_t ck_a = 0;
          uint8_t ck_b = 0;

          for (size_t i = 2; i < msg.size(); i++) {
            ck_a += msg[i];
            ck_b += ck_a;
          }

          msg.push_back(ck_a);
          msg.push_back(ck_b);


          // ------------------------------------------------------------------
          // Drain anything currently waiting in the UART RX buffer.
          // ------------------------------------------------------------------

          uint8_t discard;

          while (id(gps_uart)->available() > 0) {
            id(gps_uart)->read_byte(&discard);
          }


          ESP_LOGI(
            "gnss",
            "Sending CFG-GNSS GPS + BeiDou (%u bytes)",
            (unsigned) msg.size()
          );


          // ------------------------------------------------------------------
          // Send CFG-GNSS
          // ------------------------------------------------------------------

          id(gps_uart)->write_array(msg.data(), msg.size());
          id(gps_uart)->flush();


          // ------------------------------------------------------------------
          // Wait for UBX-ACK-ACK or UBX-ACK-NAK
          //
          // ACK-ACK:
          // B5 62 05 01 02 00 06 3E CK_A CK_B
          //
          // ACK-NAK:
          // B5 62 05 00 02 00 06 3E CK_A CK_B
          // ------------------------------------------------------------------

          const uint32_t timeout_ms = 1500;
          const uint32_t start_ms = esphome::millis();

          uint8_t state = 0;

          uint8_t ack_class = 0;
          uint8_t ack_id = 0;

          uint8_t ack_payload[2] = {0, 0};

          uint8_t rx_ck_a = 0;
          uint8_t rx_ck_b = 0;

          bool ack_received = false;
          bool ack_ok = false;


          while ((esphome::millis() - start_ms) < timeout_ms) {

            if (id(gps_uart)->available() == 0) {
              delay(1);
              continue;
            }

            uint8_t c;

            if (!id(gps_uart)->read_byte(&c)) {
              continue;
            }


            // --------------------------------------------------------------
            // UBX parser
            // --------------------------------------------------------------

            switch (state) {

              // ------------------------------------------------------------
              // Sync byte 1
              // ------------------------------------------------------------

              case 0:

                if (c == 0xB5) {
                  state = 1;
                }

                break;


              // ------------------------------------------------------------
              // Sync byte 2
              // ------------------------------------------------------------

              case 1:

                if (c == 0x62) {

                  state = 2;

                } else if (c == 0xB5) {

                  state = 1;

                } else {

                  state = 0;
                }

                break;


              // ------------------------------------------------------------
              // Class
              // ------------------------------------------------------------

              case 2:

                ack_class = c;

                rx_ck_a = c;
                rx_ck_b = rx_ck_a;

                state = 3;

                break;


              // ------------------------------------------------------------
              // Message ID
              // ------------------------------------------------------------

              case 3:

                ack_id = c;

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 4;

                break;


              // ------------------------------------------------------------
              // Length LSB
              // ------------------------------------------------------------

              case 4:

                if (c != 0x02) {

                  state = 0;

                  break;
                }

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 5;

                break;


              // ------------------------------------------------------------
              // Length MSB
              // ------------------------------------------------------------

              case 5:

                if (c != 0x00) {

                  state = 0;

                  break;
                }

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 6;

                break;


              // ------------------------------------------------------------
              // Payload byte 0
              // ------------------------------------------------------------

              case 6:

                ack_payload[0] = c;

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 7;

                break;


              // ------------------------------------------------------------
              // Payload byte 1
              // ------------------------------------------------------------

              case 7:

                ack_payload[1] = c;

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 8;

                break;


              // ------------------------------------------------------------
              // Checksum A
              // ------------------------------------------------------------

              case 8:

                if (c != rx_ck_a) {

                  ESP_LOGW(
                    "gnss",
                    "Invalid UBX ACK checksum A"
                  );

                  state = 0;

                  break;
                }

                state = 9;

                break;


              // ------------------------------------------------------------
              // Checksum B
              // ------------------------------------------------------------

              case 9:

                if (c != rx_ck_b) {

                  ESP_LOGW(
                    "gnss",
                    "Invalid UBX ACK checksum B"
                  );

                  state = 0;

                  break;
                }


                // ----------------------------------------------------------
                // Valid ACK packet.
                //
                // ACK-ACK = 0x05 / 0x01
                // ACK-NAK = 0x05 / 0x00
                //
                // Payload:
                //   0x06 = CFG class
                //   0x3E = CFG-GNSS
                // ----------------------------------------------------------

                if (
                  ack_class == 0x05 &&
                  (ack_id == 0x00 || ack_id == 0x01) &&
                  ack_payload[0] == 0x06 &&
                  ack_payload[1] == 0x3E
                ) {

                  ack_received = true;
                  ack_ok = (ack_id == 0x01);

                }

                state = 0;

                break;


              default:

                state = 0;

                break;
            }


            if (ack_received) {
              break;
            }
          }


          // ------------------------------------------------------------------
          // Report result
          // ------------------------------------------------------------------

          if (!ack_received) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS GPS + BeiDou: NO ACK received"
            );

          } else if (!ack_ok) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS GPS + BeiDou: RECEIVER RETURNED NAK"
            );

          } else {

            ESP_LOGI(
              "gnss",
              "CFG-GNSS GPS + BeiDou: ACK-ACK received"
            );
          }


          // Store result in the global.
          //
          // "BeiDou" means the receiver accepted the command.
          // Empty string means the command failed.

          if (ack_received && ack_ok) {

            id(active_constellation) = "BeiDou";

          }


      # Give receiver time to apply configuration.
      - delay: 750ms


      - lambda: |-

          if (id(active_constellation) == "BeiDou") {

            id(gnss_secondary_constellation).publish_state("BeiDou");

            ESP_LOGI(
              "gnss",
              "GNSS successfully switched to GPS + BeiDou"
            );

          }


  # ==========================================================================
  # Switch to GPS + GLONASS
  # ==========================================================================

  - id: switch_to_glonass
    mode: single
    then:

      - logger.log:
          level: INFO
          format: "GNSS: requesting GPS + GLONASS configuration"

      - lambda: |-

          // ------------------------------------------------------------------
          // Build UBX-CFG-GNSS
          //
          // GPS + GLONASS
          // ------------------------------------------------------------------

          std::vector<uint8_t> msg = {

            // UBX sync
            0xB5, 0x62,

            // Class = CFG
            // ID    = GNSS
            0x06, 0x3E,

            // Payload length = 20
            0x14, 0x00,

            // --------------------------------------------------------------
            // CFG-GNSS header
            // --------------------------------------------------------------

            // msgVer
            0x00,

            // numTrkChHw
            0x20,

            // numTrkChUse
            0x20,

            // numConfigBlocks
            0x02,


            // --------------------------------------------------------------
            // GPS
            // --------------------------------------------------------------

            // gnssId = GPS
            0x00,

            // resTrkCh = 8
            0x08,

            // maxTrkCh = 16
            0x10,

            // reserved
            0x00,

            // flags = 0x01010001
            0x01, 0x00, 0x01, 0x01,


            // --------------------------------------------------------------
            // GLONASS
            // --------------------------------------------------------------

            // gnssId = GLONASS
            0x06,

            // resTrkCh = 8
            0x08,

            // maxTrkCh = 14
            0x0E,

            // reserved
            0x00,

            // flags = 0x01010001
            0x01, 0x00, 0x01, 0x01
          };


          // ------------------------------------------------------------------
          // Calculate UBX Fletcher checksum
          // ------------------------------------------------------------------

          uint8_t ck_a = 0;
          uint8_t ck_b = 0;

          for (size_t i = 2; i < msg.size(); i++) {
            ck_a += msg[i];
            ck_b += ck_a;
          }

          msg.push_back(ck_a);
          msg.push_back(ck_b);


          // ------------------------------------------------------------------
          // Drain stale UART data.
          // ------------------------------------------------------------------

          uint8_t discard;

          while (id(gps_uart)->available() > 0) {
            id(gps_uart)->read_byte(&discard);
          }


          ESP_LOGI(
            "gnss",
            "Sending CFG-GNSS GPS + GLONASS (%u bytes)",
            (unsigned) msg.size()
          );


          // ------------------------------------------------------------------
          // Send configuration
          // ------------------------------------------------------------------

          id(gps_uart)->write_array(msg.data(), msg.size());
          id(gps_uart)->flush();


          // ------------------------------------------------------------------
          // Wait for UBX-ACK-ACK or UBX-ACK-NAK
          // ------------------------------------------------------------------

          const uint32_t timeout_ms = 1500;
          const uint32_t start_ms = esphome::millis();

          uint8_t state = 0;

          uint8_t ack_class = 0;
          uint8_t ack_id = 0;

          uint8_t ack_payload[2] = {0, 0};

          uint8_t rx_ck_a = 0;
          uint8_t rx_ck_b = 0;

          bool ack_received = false;
          bool ack_ok = false;


          while ((esphome::millis() - start_ms) < timeout_ms) {

            if (id(gps_uart)->available() == 0) {
              delay(1);
              continue;
            }

            uint8_t c;

            if (!id(gps_uart)->read_byte(&c)) {
              continue;
            }


            // --------------------------------------------------------------
            // UBX parser
            // --------------------------------------------------------------

            switch (state) {

              // Sync byte 1
              case 0:

                if (c == 0xB5) {
                  state = 1;
                }

                break;


              // Sync byte 2
              case 1:

                if (c == 0x62) {

                  state = 2;

                } else if (c == 0xB5) {

                  state = 1;

                } else {

                  state = 0;
                }

                break;


              // Class
              case 2:

                ack_class = c;

                rx_ck_a = c;
                rx_ck_b = rx_ck_a;

                state = 3;

                break;


              // Message ID
              case 3:

                ack_id = c;

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 4;

                break;


              // Length LSB
              case 4:

                if (c != 0x02) {

                  state = 0;

                  break;
                }

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 5;

                break;


              // Length MSB
              case 5:

                if (c != 0x00) {

                  state = 0;

                  break;
                }

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 6;

                break;


              // Payload byte 0
              case 6:

                ack_payload[0] = c;

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 7;

                break;


              // Payload byte 1
              case 7:

                ack_payload[1] = c;

                rx_ck_a += c;
                rx_ck_b += rx_ck_a;

                state = 8;

                break;


              // Checksum A
              case 8:

                if (c != rx_ck_a) {

                  ESP_LOGW(
                    "gnss",
                    "Invalid UBX ACK checksum A"
                  );

                  state = 0;

                  break;
                }

                state = 9;

                break;


              // Checksum B
              case 9:

                if (c != rx_ck_b) {

                  ESP_LOGW(
                    "gnss",
                    "Invalid UBX ACK checksum B"
                  );

                  state = 0;

                  break;
                }


                // ----------------------------------------------------------
                // Check whether this is our CFG-GNSS ACK.
                // ----------------------------------------------------------

                if (
                  ack_class == 0x05 &&
                  (ack_id == 0x00 || ack_id == 0x01) &&
                  ack_payload[0] == 0x06 &&
                  ack_payload[1] == 0x3E
                ) {

                  ack_received = true;
                  ack_ok = (ack_id == 0x01);

                }

                state = 0;

                break;


              default:

                state = 0;

                break;
            }


            if (ack_received) {
              break;
            }
          }


          // ------------------------------------------------------------------
          // Report result
          // ------------------------------------------------------------------

          if (!ack_received) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS GPS + GLONASS: NO ACK received"
            );

          } else if (!ack_ok) {

            ESP_LOGE(
              "gnss",
              "CFG-GNSS GPS + GLONASS: RECEIVER RETURNED NAK"
            );

          } else {

            ESP_LOGI(
              "gnss",
              "CFG-GNSS GPS + GLONASS: ACK-ACK received"
            );
          }


          // Store result only after successful ACK.

          if (ack_received && ack_ok) {

            id(active_constellation) = "GLONASS";

          }


      # Give receiver time to apply configuration.
      - delay: 750ms


      - lambda: |-

          if (id(active_constellation) == "GLONASS") {

            id(gnss_secondary_constellation).publish_state("GLONASS");

            ESP_LOGI(
              "gnss",
              "GNSS successfully switched to GPS + GLONASS"
            );

          }


# ==============================================================================
# ESPHome selector
# ==============================================================================

select:

  - platform: template

    name: "GNSS Secondary Constellation Selector"

    id: gnss_secondary_constellation

    restore_value: false

    optimistic: true

    initial_option: "GLONASS"

    options:
      - "GLONASS"
      - "BeiDou"

    set_action:

      - if:
          condition:
            lambda: |-
              return x != id(active_constellation);

          then:

            - lambda: |-
                ESP_LOGI(
                  "gnss",
                  "Requested constellation change: %s",
                  x.c_str()
                );


            - if:
                condition:
                  lambda: |-
                    return x == "BeiDou";

                then:

                  - script.execute: switch_to_beidou

                else:

                  - script.execute: switch_to_glonass
