globals:
  - id: active_constellation
    type: std::string
    restore_value: no
    initial_value: '"GLONASS"'

script:
  # --------------------------------------------------------------------------
  # Switch to BeiDou (Forced Low-Level C++ Stream Injection)
  # --------------------------------------------------------------------------
  - id: switch_to_beidou
    mode: restart
    then:
      - logger.log: "Bypassing lock: Injecting UBX-CFG-GNSS for BeiDou..."
      - lambda: |-
          std::vector<uint8_t> frame = {
            0xB5, 0x62,             // Sync bytes
            0x06, 0x3E,             // CFG-GNSS Class/ID
            0x2C, 0x00,             // Payload Length (44 bytes)
            0x00, 0x20, 0x20, 0x05, // Ver 0, 32 max channels, 5 blocks
            0x00, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01, // GPS (Enabled)
            0x01, 0x01, 0x03, 0x00, 0x01, 0x00, 0x01, 0x01, // SBAS (Enabled)
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01, // BeiDou (Enabled)
            0x05, 0x00, 0x03, 0x00, 0x01, 0x00, 0x01, 0x01, // QZSS (Enabled)
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x00  // GLONASS (Disabled)
          };

          uint8_t ck_a = 0, ck_b = 0;
          for (size_t i = 2; i < frame.size(); i++) {
            ck_a += frame[i];
            ck_b += ck_a;
          }
          frame.push_back(ck_a);
          frame.push_back(ck_b);

          for(uint8_t byte : frame) {
            id(gps_uart)->write_byte(byte);
          }
          id(gps_uart)->flush();

      - delay: 150ms

      - logger.log: "Injecting Controlled GNSS Correlator Reset..."
      - lambda: |-
          std::vector<uint8_t> rst_frame = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };
          for(uint8_t byte : rst_frame) {
            id(gps_uart)->write_byte(byte);
          }
          id(gps_uart)->flush();
          
          // Forcefully commit the state state update directly down to the UI
          id(gnss_secondary_constellation).publish_state("BeiDou");
      - logger.log: "M8030 baseband re-mapping to BeiDou completed."

  # --------------------------------------------------------------------------
  # Switch to GLONASS (Forced Low-Level C++ Stream Injection)
  # --------------------------------------------------------------------------
  - id: switch_to_glonass
    mode: restart
    then:
      - logger.log: "Bypassing lock: Injecting UBX-CFG-GNSS for GLONASS..."
      - lambda: |-
          std::vector<uint8_t> frame = {
            0xB5, 0x62,             // Sync bytes
            0x06, 0x3E,             // CFG-GNSS Class/ID
            0x2C, 0x00,             // Payload Length (44 bytes)
            0x00, 0x20, 0x20, 0x05, // Ver 0, 32 max channels, 5 blocks
            0x00, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x01, // GPS (Enabled)
            0x01, 0x01, 0x03, 0x00, 0x01, 0x00, 0x01, 0x01, // SBAS (Enabled)
            0x03, 0x08, 0x10, 0x00, 0x01, 0x00, 0x01, 0x00, // BeiDou (Disabled)
            0x05, 0x00, 0x03, 0x00, 0x01, 0x00, 0x01, 0x01, // QZSS (Enabled)
            0x06, 0x08, 0x0E, 0x00, 0x01, 0x00, 0x01, 0x01  // GLONASS (Enabled)
          };

          uint8_t ck_a = 0, ck_b = 0;
          for (size_t i = 2; i < frame.size(); i++) {
            ck_a += frame[i];
            ck_b += ck_a;
          }
          frame.push_back(ck_a);
          frame.push_back(ck_b);

          for(uint8_t byte : frame) {
            id(gps_uart)->write_byte(byte);
          }
          id(gps_uart)->flush();

      - delay: 150ms

      - logger.log: "Injecting Controlled GNSS Correlator Reset..."
      - lambda: |-
          std::vector<uint8_t> rst_frame = {
            0xB5, 0x62, 0x06, 0x04, 0x04, 0x00, 0x00, 0x00, 0x02, 0x00, 0x10, 0x3B
          };
          for(uint8_t byte : rst_frame) {
            id(gps_uart)->write_byte(byte);
          }
          id(gps_uart)->flush();
          
          // Forcefully commit the state state update directly down to the UI
          id(gnss_secondary_constellation).publish_state("GLONASS");
      - logger.log: "M8030 baseband re-mapping to GLONASS completed."

select:
  - platform: template
    name: "GNSS Secondary Constellation Selector"
    id: gnss_secondary_constellation
    restore_value: false
    optimistic: true           # Keeps UI lock static on whatever string option the user clicked
    initial_option: "GLONASS"  # Removes unstable loop lambda hooks
    options:
      - "GLONASS"
      - "BeiDou"
    set_action:
      - if:
          condition:
            lambda: |-
              return (x != id(active_constellation));
          then:
            - lambda: |-
                ESP_LOGI("gnss", "Switching constellation to: %s", x.c_str());
                id(active_constellation) = x;
            - if:
                condition:
                  lambda: |-
                    return x == "BeiDou";
                then:
                  - script.execute: switch_to_beidou
                else:
                  - script.execute: switch_to_glonass
